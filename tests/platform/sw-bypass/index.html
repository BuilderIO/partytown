    <meta name="description" content="Partytown Test Page" />
    <title>Service Worker Bypass</title>
    <script>
      partytown = {
        fallbackTimeout: 10000,
      };
    </script>
    <script src="/~partytown/debug/partytown.js"></script>

  <body>
    <h1>Service Worker Bypass</h1>

      <li>
        <strong>script falls back when the sandbox bypasses the service worker</strong>
        <code id="testBypass"></code>
      </li>
    </ul>

    <script type="text/partytown">
      document.getElementById('testBypass').textContent = 'executed';
      document.body.classList.add('completed');
    </script>

    <hr />

    <hr />
